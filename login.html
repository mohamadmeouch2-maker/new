
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <style>

    body {

        background-color: lightblue;

        text-align: center;

        font-family: Arial;

    }

    h1 {

        color: darkblue;

    }

    button {

        background-color: blue;

        color: white;

        padding: 10px 25px;

        border: none;

        border-radius: 5px;

    }

</style>
    </head>
<body>

    <h1>Welcome Back!</h1>

    <form>
        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter your password">

        <br><br>

        <button type="submit">Login</button>
    </form>

</body>
</html>
